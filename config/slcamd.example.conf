# slcamd configuration. Every key is optional; defaults are shown.
# Unknown keys are rejected at startup, so typos can't silently fall back to defaults.
# Validate with:  slcamd --config /etc/superlotis/slcamd.conf --check-config

[server]
# Loopback by default. To accept commands from the observatory network set the
# camera PC's address (or 0.0.0.0) AND set auth_token.
bind_address = 127.0.0.1
port = 6972
max_clients = 8
idle_timeout_s = 600
# Shared secret; clients must send "auth <token>" first. Empty disables auth.
auth_token =
# Allow the "shutdown" command over the network.
allow_remote_shutdown = false

[camera]
# simulated | picam   (picam requires a build with -DSUPERLOTIS_WITH_PICAM=ON)
backend = simulated
default_exptime_s = 1.0
default_shutter = normal
# initial_gain = high
# initial_setpoint_c = -60

[picam]
# Use the PICam SDK's virtual Sophia instead of real hardware. Never enabled implicitly.
demo = false
readout_timeout_s = 30

[limits]
min_exptime_s = 0
max_exptime_s = 240
min_setpoint_c = -80
max_setpoint_c = 90
max_burst = 100

[storage]
# Files go to <data_dir>/<YYYYMMDD UTC>/<prefix>_<timestamp>_<type>_<seq>.fits
data_dir = /var/lib/superlotis/data
prefix = superlotis

[fits]
telescope = SuperLOTIS
instrument = Sophia 2048B-UV
observer =

[simulator]
width = 2048
height = 2048
seed = 0
# 1 = real time; 0 = no waiting (tests)
time_scale = 1.0
bias_adu = 500
read_noise_adu = 5
dark_rate_adu_s = 0.05
sky_rate_adu_s = 20
ambient_c = 20
cooldown_tau_s = 60
readout_s = 0.5

[log]
# debug | info | warn | error
level = info
