[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superlotis-camera"
version = "0.1.0"
description = "Python client and CLI for the SuperLOTIS camera control server (slcamd)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jacob Vider" }]
keywords = ["astronomy", "ccd", "camera", "telescope", "instrument-control", "fits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "mypy>=1.8", "ruff>=0.5", "astropy>=5", "numpy>=1.22"]

[project.scripts]
slcam = "superlotis.cli:main"

[project.urls]
Documentation = "https://github.com/jacobvider/superlotis-camera/tree/main/docs"
Source = "https://github.com/jacobvider/superlotis-camera"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superlotis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: tests that launch the real slcamd binary (set SLCAMD_BIN)"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = [
    "S101",  # assert is fine in tests
    "N818",  # exception names mirror the server error codes (Busy, OutOfRange, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
